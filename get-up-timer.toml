# get-up-timer Configuration
# Copy this file to $XDG_CONFIG_HOME/get-up-timer/config.toml or /etc/get-up-timer/config.toml

# Timing configuration
[timing]
# Minutes of continuous activity before showing "GET UP" alert
alert_after_minutes = 60

# Minutes of break needed to clear the alert
break_after_minutes = 5

# Minutes of inactivity before considering user idle
idle_after_minutes = 5

# Notifications configuration
[notifications]
# Whether sound notifications are enabled
sound_enabled = true

# Command to play sound when alert triggers (if sound_enabled = true)
# sound_command = "paplay /usr/share/sounds/alert.wav"

# Whether desktop notifications are enabled (using notify-send)
desktop_notifications = true

# Re-send the alert notification this often while in Alert state (minutes)
# Set to null or comment out to disable repeat notifications
# repeat_interval_minutes = 10

# Default snooze duration when using snooze command (minutes)
# snooze_minutes = 15
