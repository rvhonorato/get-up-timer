name: ci

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: codeberg-small
    container:
      image: docker.io/library/rust:1

    steps:
      - name: Checkout code
        # the remote is the source of truth
        run: |
          git init -b main .
          git remote add origin https://codeberg.org/rvhonorato/get-up-timer.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD

      - name: Setup test env
        # use prebuilt tarpaulin binary: `cargo install` take 10min+
        run: |
          rustup component add clippy
          curl -sL https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin
          curl -Ls https://coverage.codacy.com/get.sh -o /tmp/codacy.sh

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests with coverage
        run: cargo tarpaulin --engine llvm --out Xml --output-dir ./coverage

      - name: Upload coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            bash /tmp/codacy.sh report -r coverage/cobertura.xml
          else
            echo "CODACY_PROJECT_TOKEN not set, skipping upload"
          fi
