[package]
name = "get-up-timer"
version = "0.4.1"
edition = "2024"
description = "A simple daemon that monitors keyboard and mouse activity and reminds you to take breaks"
license = "MIT"
repository = "https://github.com/rvhonorato/get-up-timer"
readme = "README.md"
keywords = ["daemon", "break-timer", "activity-monitor", "linux", "systemd"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
